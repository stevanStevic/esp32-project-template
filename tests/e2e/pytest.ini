[pytest]
# pytest-embedded configuration
# Adjust target, port, and baud rate for your hardware setup.

# Target chip
addopts = --target esp32s3

# Serial port (override with: pytest --port /dev/ttyACM1)
# addopts = --port /dev/ttyACM0

# Flash baud rate
# addopts = --baud 460800

# Test markers — add project-specific markers here
markers =
    esp32s3: Tests that run on ESP32-S3 hardware
    smoke:   Quick sanity-check tests
    slow:    Tests that take more than 30 seconds
